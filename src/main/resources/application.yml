server:
  port: 8080

spring:
  application:
    name: bank-rest

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bank_cards}
    username: ${DB_USERNAME:bank_user}
    password: ${DB_PASSWORD:bank_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  liquibase:
    change-log: classpath:db/migration/db.changelog-master.yaml

app:
  security:
    jwt-secret: ${JWT_SECRET:change-this-super-secret-key-min-32-chars-long}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    card-encryption-secret: ${CARD_ENCRYPTION_SECRET:change-this-card-encryption-secret}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.example.bankcards: INFO
    org.springframework.security: WARN
